<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista de la compra departamentada - comparte por enlace, WhatsApp o QR">
    <title>🛒 Lista de la Compra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LZ-String: comprime y hace URL-safe el JSON (soporta tildes/ñ) -->
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .item-comprado { text-decoration: line-through; opacity: 0.55; }
        .departamento-header { cursor: pointer; user-select: none; }
        .arrow { display: inline-block; transition: transform 0.2s ease; }
        .arrow.collapsed { transform: rotate(-90deg); }
        .departamento-body.collapsed { display: none; }
        .modal { animation: modalPop 0.25s ease forwards; }
        @keyframes modalPop {
            from { transform: scale(0.94); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

    <!-- HEADER -->
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between gap-2 flex-wrap">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-emerald-500/20">🛒</div>
                <div>
                    <h1 class="text-xl font-semibold leading-tight">Lista de la Compra</h1>
                    <p class="text-emerald-400 text-xs">Departamentada</p>
                </div>
            </div>
            <div class="flex items-center gap-x-2">
                <button onclick="nuevaLista()" title="Nueva lista"
                        class="bg-zinc-800 hover:bg-zinc-700 px-3 h-10 rounded-2xl text-sm font-medium border border-zinc-700">
                    ✚ <span class="hidden sm:inline">Nueva</span>
                </button>
                <button onclick="mostrarCompartir()"
                        class="bg-emerald-600 hover:bg-emerald-500 px-4 h-10 rounded-2xl text-sm font-semibold shadow-lg shadow-emerald-500/30">
                    🔗 <span class="hidden sm:inline">Compartir</span>
                </button>
                <button onclick="limpiarComprados()" title="Limpiar comprados"
                        class="bg-zinc-800 hover:bg-zinc-700 px-3 h-10 rounded-2xl text-sm border border-zinc-700">🧹</button>
                <button onclick="mostrarEstadisticas()"
                        class="bg-zinc-800 text-emerald-400 text-sm font-medium px-3 h-10 rounded-3xl border border-zinc-700">
                    <span id="contador-text">0 / 0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- FORMULARIO -->
        <section class="bg-zinc-900 rounded-3xl p-5 shadow-xl border border-zinc-800 mb-6">
            <div class="flex flex-col md:flex-row gap-3">
                <div class="flex-1">
                    <label class="block text-zinc-400 text-xs font-medium mb-1 ml-1">Producto</label>
                    <input id="producto-input" type="text" autocomplete="off"
                           placeholder="Ej: Leche entera, plátanos, detergente..."
                           class="w-full bg-zinc-800 text-white placeholder:text-zinc-500 rounded-2xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-transparent">
                </div>
                <div class="md:w-64">
                    <label class="block text-zinc-400 text-xs font-medium mb-1 ml-1">Departamento</label>
                    <select id="departamento-select"
                            class="w-full bg-zinc-800 text-white rounded-2xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-transparent"></select>
                </div>
                <div class="flex items-end">
                    <button onclick="agregarProducto()"
                            class="bg-emerald-500 hover:bg-emerald-600 w-full md:w-auto h-12 px-6 rounded-2xl text-white font-semibold flex items-center justify-center gap-x-2 shadow-lg shadow-emerald-500/30">
                        <span class="text-xl leading-none">+</span> AÑADIR
                    </button>
                </div>
            </div>
        </section>

        <!-- LISTA -->
        <div class="mb-3 flex items-center justify-between">
            <h2 class="text-lg font-semibold">Mi lista</h2>
            <div class="text-zinc-400 text-sm"><span id="total-items"></span></div>
        </div>

        <div id="lista-container" class="space-y-5"></div>

        <!-- ESTADO VACÍO -->
        <div id="empty-state" class="hidden py-16 text-center">
            <div class="mx-auto w-20 h-20 bg-zinc-900 rounded-3xl flex items-center justify-center text-5xl mb-5">🛒</div>
            <h3 class="text-2xl font-medium mb-2">Tu lista está vacía</h3>
            <p class="text-zinc-400 max-w-xs mx-auto text-sm">Añade productos por departamento y compártela con quien quieras</p>
            <button onclick="document.getElementById('producto-input').focus()"
                    class="mt-6 bg-white text-zinc-900 px-6 py-3 rounded-2xl font-semibold inline-flex items-center gap-x-2">
                ✚ Empezar lista
            </button>
        </div>
    </main>

    <!-- MODAL COMPARTIR -->
    <div id="modal-compartir"
         class="hidden fixed inset-0 bg-black/70 items-center justify-center z-50 p-4">
        <div class="modal bg-zinc-900 rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-zinc-800">
            <h3 class="text-xl font-semibold mb-4 text-center">Comparte tu lista</h3>

            <div class="bg-white/5 border border-white/10 rounded-2xl p-4 mb-5">
                <div class="text-xs text-emerald-400 font-medium mb-2">Enlace de la lista:</div>
                <div id="share-url"
                     class="text-zinc-300 text-xs font-mono break-all bg-zinc-950 p-3 rounded-xl mb-3 max-h-24 overflow-y-auto"></div>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="copiarEnlace()"
                            class="flex flex-col items-center py-3 bg-white/5 hover:bg-white/10 rounded-2xl text-xs font-medium gap-y-1">
                        <span class="text-lg">📋</span>Copiar
                    </button>
                    <button onclick="compartirWhatsApp()"
                            class="flex flex-col items-center py-3 bg-white/5 hover:bg-white/10 rounded-2xl text-xs font-medium gap-y-1">
                        <span class="text-lg">📱</span>WhatsApp
                    </button>
                    <button onclick="generarQR()"
                            class="flex flex-col items-center py-3 bg-white/5 hover:bg-white/10 rounded-2xl text-xs font-medium gap-y-1">
                        <span class="text-lg">📲</span>QR
                    </button>
                </div>
            </div>

            <div id="qr-preview" class="hidden flex-col items-center">
                <div class="bg-white p-3 rounded-2xl mb-3">
                    <img id="qr-image" alt="QR de la lista" class="w-56 h-56">
                </div>
                <p class="text-xs text-zinc-400 text-center">Escanea este código con tu móvil</p>
            </div>

            <div class="flex gap-x-2 mt-5">
                <button onclick="cerrarModal()"
                        class="flex-1 py-3 text-zinc-400 hover:text-white font-medium rounded-2xl">Cerrar</button>
                <button onclick="cerrarModal()"
                        class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-2xl">Listo</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast"
         class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-emerald-600 text-white text-sm font-medium px-5 py-3 rounded-2xl shadow-2xl z-[60]">
        <span id="toast-text"></span>
    </div>

<script>
// ============================================================
//  CONFIGURACIÓN
// ============================================================
const DEPARTAMENTOS = [
    { nombre: "Frutas y Verduras",       icono: "🥬" },
    { nombre: "Lácteos y Huevos",         icono: "🥛" },
    { nombre: "Carnes, Aves y Pescados",  icono: "🥩" },
    { nombre: "Panadería y Repostería",   icono: "🥖" },
    { nombre: "Bebidas",                  icono: "🥤" },
    { nombre: "Conservas y Enlatados",    icono: "🥫" },
    { nombre: "Congelados",               icono: "🧊" },
    { nombre: "Despensa",                 icono: "🍝" },
    { nombre: "Limpieza del Hogar",       icono: "🧽" },
    { nombre: "Higiene y Belleza",        icono: "🧴" },
    { nombre: "Otros",                    icono: "📦" }
];
const STORAGE_KEY = 'listaCompra2026';

let lista = [];
const collapsedDepts = new Set();

// ============================================================
//  UTILIDADES
// ============================================================
function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function iconoDepto(nombre) {
    const d = DEPARTAMENTOS.find(x => x.nombre === nombre);
    return d ? d.icono : '📦';
}

// ============================================================
//  ENCODE / DECODE (URL-safe + UTF-8)
// ============================================================
function encodeLista(arr) {
    // Formato compacto: [[nombre, departamento, comprado], ...]
    const compacto = arr.map(i => [i.nombre, i.departamento, i.comprado ? 1 : 0]);
    const json = JSON.stringify(compacto);
    try {
        // LZ-String ya devuelve cadena URL-safe
        return LZString.compressToEncodedURIComponent(json);
    } catch (e) {
        // Fallback: base64 URL-safe UTF-8
        return 'b64_' + b64UrlEncode(json);
    }
}

function decodeLista(str) {
    if (!str) return null;
    try {
        let json;
        if (str.startsWith('b64_')) {
            json = b64UrlDecode(str.slice(4));
        } else {
            json = LZString.decompressFromEncodedURIComponent(str);
        }
        if (!json) return null;
        const arr = JSON.parse(json);
        if (!Array.isArray(arr)) return null;
        return arr.map(([nombre, departamento, comprado]) => ({
            id: uid(),
            nombre: String(nombre),
            departamento: departamento || 'Otros',
            comprado: !!comprado
        }));
    } catch (e) {
        console.error('Error decodificando lista:', e);
        return null;
    }
}

function b64UrlEncode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64UrlDecode(str) {
    let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
}

// ============================================================
//  PERSISTENCIA
// ============================================================
function guardarLista() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(lista)); }
    catch (e) { console.warn('No se pudo guardar:', e); }
}

function cargarLista() {
    try {
        const guardada = localStorage.getItem(STORAGE_KEY);
        if (guardada) lista = JSON.parse(guardada) || [];
    } catch (e) { lista = []; }

    // ¿Lista compartida por URL?
    const params = new URLSearchParams(window.location.search);
    if (params.has('d')) {
        const compartida = decodeLista(params.get('d'));
        if (compartida && compartida.length) {
            const mensaje = lista.length > 0
                ? `📥 Has recibido una lista compartida con ${compartida.length} productos.\n\n` +
                  `Aceptar → REEMPLAZA tu lista actual\n` +
                  `Cancelar → se mantiene tu lista actual`
                : `📥 Has recibido una lista con ${compartida.length} productos.\n\n¿Quieres cargarla?`;
            if (confirm(mensaje)) {
                lista = compartida;
                guardarLista();
            }
        } else {
            alert('⚠️ El enlace compartido no es válido o está dañado.');
        }
        // Limpiar la URL
        history.replaceState({}, document.title, window.location.pathname);
    }
}

// ============================================================
//  RENDER
// ============================================================
function renderizarLista() {
    const container = document.getElementById('lista-container');
    const empty = document.getElementById('empty-state');

    if (lista.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        actualizarContador();
        return;
    }
    empty.classList.add('hidden');

    // Agrupar por departamento
    const grupos = {};
    for (const item of lista) {
        const d = item.departamento || 'Otros';
        if (!grupos[d]) grupos[d] = [];
        grupos[d].push(item);
    }

    const deptos = Object.keys(grupos).sort((a, b) => a.localeCompare(b, 'es'));

    let html = '';
    for (const depto of deptos) {
        const items = grupos[depto];
        const comprados = items.filter(i => i.comprado).length;
        const icono = iconoDepto(depto);
        const collapsed = collapsedDepts.has(depto) ? 'collapsed' : '';

        html += `
        <div class="bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800">
            <div class="departamento-header px-5 py-4 bg-zinc-800/60 hover:bg-zinc-800 flex items-center justify-between gap-3"
                 data-depto="${encodeURIComponent(depto)}">
                <div class="flex items-center gap-x-3 flex-wrap">
                    <span class="text-xl">${icono}</span>
                    <span class="font-medium">${escapeHtml(depto)}</span>
                    <span class="text-[11px] bg-white/10 px-2 py-0.5 rounded-full">${items.length}</span>
                </div>
                <div class="flex items-center gap-x-3">
                    <span class="text-emerald-400 text-sm">${comprados}/${items.length}</span>
                    <span class="arrow text-zinc-400 ${collapsed}">▼</span>
                </div>
            </div>
            <div class="departamento-body ${collapsed}">
                ${items.map(item => `
                    <div class="flex items-center gap-x-3 px-5 py-3 border-b border-zinc-800 last:border-b-0 group">
                        <input type="checkbox" ${item.comprado ? 'checked' : ''}
                               onchange="marcarComprado('${item.id}')"
                               class="w-5 h-5 accent-emerald-500 cursor-pointer shrink-0">
                        <div class="flex-1 ${item.comprado ? 'item-comprado' : ''} truncate">${escapeHtml(item.nombre)}</div>
                        <button onclick="eliminarItem('${item.id}')" title="Eliminar"
                                class="text-red-400 hover:text-red-300 text-lg px-2 opacity-50 hover:opacity-100">✕</button>
                    </div>
                `).join('')}
            </div>
        </div>`;
    }

    container.innerHTML = html;

    // Listeners de plegado
    container.querySelectorAll('.departamento-header').forEach(el => {
        el.addEventListener('click', () => {
            const body = el.nextElementSibling;
            const arrow = el.querySelector('.arrow');
            const isCollapsed = body.classList.toggle('collapsed');
            arrow.classList.toggle('collapsed', isCollapsed);
            const depto = decodeURIComponent(el.dataset.depto);
            if (isCollapsed) collapsedDepts.add(depto);
            else collapsedDepts.delete(depto);
        });
    });

    actualizarContador();
}

function actualizarContador() {
    const total = lista.length;
    const comprados = lista.filter(i => i.comprado).length;
    document.getElementById('contador-text').textContent = `${comprados} / ${total}`;
    document.getElementById('total-items').innerHTML =
        `<span class="text-emerald-400">${comprados}</span> comprados · ${total} total`;
}

// ============================================================
//  ACCIONES
// ============================================================
function agregarProducto() {
    const input = document.getElementById('producto-input');
    const select = document.getElementById('departamento-select');
    const nombre = input.value.trim();
    if (!nombre) { input.focus(); return; }

    const departamento = select.value || 'Otros';

    lista.unshift({ id: uid(), nombre, departamento, comprado: false });
    input.value = '';
    input.focus();
    guardarLista();
    renderizarLista();
    mostrarToast('✅ Añadido a ' + departamento);
}

function marcarComprado(id) {
    const item = lista.find(i => i.id === id);
    if (!item) return;
    item.comprado = !item.comprado;
    guardarLista();
    renderizarLista();
    if (lista.length > 0 && lista.every(i => i.comprado)) {
        setTimeout(() => mostrarToast('🎉 ¡Lista completa!'), 400);
    }
}

function eliminarItem(id) {
    const item = lista.find(i => i.id === id);
    if (!item) return;
    if (!confirm(`¿Eliminar "${item.nombre}"?`)) return;
    lista = lista.filter(i => i.id !== id);
    guardarLista();
    renderizarLista();
}

function limpiarComprados() {
    const n = lista.filter(i => i.comprado).length;
    if (n === 0) { mostrarToast('No hay productos comprados'); return; }
    if (!confirm(`¿Eliminar ${n} producto(s) ya comprado(s)?`)) return;
    lista = lista.filter(i => !i.comprado);
    guardarLista();
    renderizarLista();
    mostrarToast('🧹 Limpieza realizada');
}

function nuevaLista() {
    if (lista.length > 0 && !confirm('¿Crear una lista nueva? Se perderá la actual.')) return;
    lista = [];
    collapsedDepts.clear();
    guardarLista();
    renderizarLista();
    mostrarToast('🆕 Lista nueva');
}

// ============================================================
//  COMPARTIR
// ============================================================
function generarShareUrl() {
    const encoded = encodeLista(lista);
    const base = window.location.origin + window.location.pathname;
    return `${base}?d=${encodeURIComponent(encoded)}`;
}

function mostrarCompartir() {
    if (lista.length === 0) {
        mostrarToast('Añade productos primero');
        return;
    }
    document.getElementById('share-url').textContent = generarShareUrl();
    document.getElementById('qr-preview').classList.add('hidden');
    document.getElementById('qr-preview').classList.remove('flex');

    const modal = document.getElementById('modal-compartir');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function cerrarModal() {
    const modal = document.getElementById('modal-compartir');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}

function copiarEnlace() {
    const url = generarShareUrl();
    const ok = () => mostrarToast('📋 Enlace copiado');
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(ok, () => fallbackCopy(url, ok));
    } else {
        fallbackCopy(url, ok);
    }
}
function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); }
    catch (e) { alert('No se pudo copiar. Copia manualmente:\n\n' + text); }
    ta.remove();
}

function compartirWhatsApp() {
    const url = generarShareUrl();
    const texto = `🛒 Mi lista de la compra:\n${url}\n\nÁbrela y ayúdame a comprar 🙌`;
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
}

function generarQR() {
    const url = generarShareUrl();
    const img = document.getElementById('qr-image');
    img.src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&color=10b981&bgcolor=ffffff&data=${encodeURIComponent(url)}`;
    const preview = document.getElementById('qr-preview');
    preview.classList.remove('hidden');
    preview.classList.add('flex');
}

// ============================================================
//  ESTADÍSTICAS
// ============================================================
function mostrarEstadisticas() {
    if (lista.length === 0) return;
    const comprados = lista.filter(i => i.comprado).length;
    const porDepto = {};
    lista.forEach(i => { porDepto[i.departamento] = (porDepto[i.departamento] || 0) + 1; });

    let txt = '📊 ESTADÍSTICAS\n\n';
    txt += `Total: ${lista.length} productos\n`;
    txt += `Comprados: ${comprados} (${Math.round(comprados / lista.length * 100)}%)\n\n`;
    txt += 'Por departamento:\n';
    Object.keys(porDepto).sort((a, b) => a.localeCompare(b, 'es'))
        .forEach(d => { txt += `• ${d}: ${porDepto[d]}\n`; });
    alert(txt);
}

// ============================================================
//  TOAST
// ============================================================
let toastTimer;
function mostrarToast(texto) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-text').innerHTML = texto;
    toast.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.add('hidden'), 2600);
}

// ============================================================
//  INICIALIZACIÓN
// ============================================================
function inicializar() {
    // Rellenar select
    const select = document.getElementById('departamento-select');
    DEPARTAMENTOS.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.nombre;
        opt.textContent = `${d.icono}  ${d.nombre}`;
        select.appendChild(opt);
    });

    // Enter en input
    document.getElementById('producto-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') agregarProducto();
    });

    // Click fuera del modal
    document.getElementById('modal-compartir').addEventListener('click', e => {
        if (e.target.id === 'modal-compartir') cerrarModal();
    });

    // Escape cierra modal
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') cerrarModal();
    });

    cargarLista();
    renderizarLista();
    console.log('%c✅ Lista de la Compra lista', 'color:#10b981;font-weight:bold');
}

window.addEventListener('DOMContentLoaded', inicializar);
</script>
</body>
</html>
