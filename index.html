<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de la compra</title>
<meta name="description" content="Lista de la compra que se puede enviar por WhatsApp y abrir desde el enlace.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="cabecera">
  <div class="cabecera__fila">
    <h1 class="cabecera__titulo">La lista</h1>
    <span class="cabecera__progreso" id="progreso"></span>
  </div>
</header>

<main class="contenido">

  <form class="buscador" id="form-añadir" autocomplete="off">
    <input type="text" id="buscar" placeholder="Añadir producto..." aria-label="Buscar o añadir producto">
    <button type="submit" class="buscador__boton">Añadir</button>
    <ul class="sugerencias" id="sugerencias" hidden></ul>
  </form>

  <p class="estado-vacio" id="estado-vacio">
    La lista está vacía. Busca un producto arriba para empezar, por ejemplo «tomates» o «leche».
  </p>

  <div id="lista"></div>

</main>

<footer class="barra-acciones">
  <button type="button" id="btn-vaciar" class="accion accion--secundaria" title="Vaciar lista">Vaciar</button>
  <button type="button" id="btn-copiar" class="accion accion--secundaria" title="Copiar enlace">Copiar enlace</button>
  <button type="button" id="btn-compartir" class="accion accion--principal">Compartir</button>
</footer>

<div class="aviso" id="aviso"></div>

<script src="js/products.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>
</body>
</html>
