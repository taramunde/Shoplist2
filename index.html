<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis Coches Aparcados</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🚗 Buscador de Coches</h1>
        <div class="car-selector">
            <button id="kiaBtn" class="car-btn active" data-car="kia">
                <span class="car-icon">🚗</span>
                <span>Kia Rio</span>
            </button>
            <button id="nissanBtn" class="car-btn" data-car="nissan">
                <span class="car-icon">🚙</span>
                <span>Nissan Juke</span>
            </button>
        </div>
    </header>

    <main>
        <div class="card map-card">
            <div id="map"></div>
            <div class="map-controls">
                <button id="locateBtn" class="btn-primary">📍 Guardar aquí</button>
                <button id="navigateBtn" class="btn-secondary" disabled>🧭 Ir</button>
                <button id="shareBtn" class="btn-secondary" disabled>📤 Compartir</button>
            </div>
        </div>

        <div class="card info-card">
            <h2 id="carTitle">📍 Kia Rio</h2>
            <div class="info-grid">
                <div>
                    <label>Coordenadas</label>
                    <p id="coords">-- , --</p>
                </div>
                <div>
                    <label>Calle</label>
                    <p id="address">Aún no guardado</p>
                </div>
                <div>
                    <label>Fecha y hora</label>
                    <p id="datetime">--</p>
                </div>
            </div>
        </div>

        <div class="card photo-card">
            <h2>📸 Foto del aparcamiento</h2>
            <div id="photoContainer" class="photo-container">
                <div id="photoPlaceholder">
                    <span>📷</span>
                    <p>Toca para hacer foto</p>
                </div>
                <img id="photoPreview" alt="Foto" style="display:none;">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
            </div>
            <div class="photo-actions">
                <button id="takePhotoBtn" class="btn-primary">Tomar foto</button>
                <button id="viewPhotoBtn" class="btn-secondary" disabled>Ver grande</button>
            </div>
        </div>

        <div class="card notes-card">
            <h2>📝 Anotaciones</h2>
            <textarea id="notes" placeholder="Ej: Planta -2, zona B, al lado ascensor..."></textarea>
            <div class="actions">
                <button id="saveBtn" class="btn-primary">💾 Guardar</button>
                <button id="clearBtn" class="btn-danger">🗑️ Borrar</button>
            </div>
        </div>

        <div class="card both-cars">
            <h2>🗺️ Ver ambos coches</h2>
            <button id="showBothBtn" class="btn-secondary" style="width:100%">Mostrar Kia Rio y Nissan Juke en mapa</button>
        </div>
    </main>

    <!-- Modal foto -->
    <div id="photoModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="Foto ampliada">
        </div>
        <p class="zoom-hint">Pellizca para zoom</p>
    </div>

    <!-- Modal compartir -->
    <div id="shareModal" class="modal">
        <div class="share-content">
            <h3>Compartir ubicación</h3>
            <p id="shareText"></p>
            <div class="share-buttons">
                <a id="whatsappLink" class="share-btn whatsapp" target="_blank">WhatsApp</a>
                <a id="telegramLink" class="share-btn telegram" target="_blank">Telegram</a>
                <button id="copyLinkBtn" class="share-btn copy">Copiar enlace</button>
            </div>
            <button class="btn-secondary close-share">Cerrar</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
